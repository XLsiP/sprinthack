<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Credentialing</title>
<style>
  body { font-family: system-ui, sans-serif; margin: 0; padding: 24px; color: #1a1a1a; background: #f6f7f9; }
  h1 { margin: 0 0 4px; }
  h2 { font-size: 16px; margin: 0 0 12px; }
  .sub { color: #666; margin-bottom: 20px; }
  .card { background: #fff; border: 1px solid #e2e5ea; border-radius: 8px; padding: 16px; margin-bottom: 16px; overflow-x: auto; }
  .counts { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 16px; }
  .count { background: #fff; border: 1px solid #e2e5ea; border-radius: 8px; padding: 12px 16px; min-width: 110px; }
  .count b { display: block; font-size: 24px; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid #eef0f3; white-space: nowrap; }
  th { color: #666; font-weight: 600; }
  .pill { padding: 2px 8px; border-radius: 999px; font-size: 12px; font-weight: 600; }
  .expired { background: #fde2e1; color: #a1160f; }
  .critical { background: #ffe8cc; color: #9a4a00; }
  .warning { background: #fff5c2; color: #6b5800; }
  .ok { background: #dcf5e3; color: #17692f; }
  form { display: flex; gap: 8px; flex-wrap: wrap; }
  input, select, button { font: inherit; padding: 6px 8px; border: 1px solid #c9ced6; border-radius: 6px; }
  button { background: #1f5eff; color: #fff; border-color: #1f5eff; cursor: pointer; }
  button.small { padding: 2px 8px; font-size: 12px; }
  #msg { color: #a1160f; min-height: 1.2em; }
</style>
</head>
<body>
  <h1>Credentialing</h1>
  <div class="sub">Clinical staff credentials, sorted by soonest expiration.</div>

  <div class="counts" id="counts"></div>
  <div id="msg"></div>

  <div class="card">
    <table>
      <thead><tr>
        <th>Staff</th><th>Role</th><th>Credential</th><th>Number</th><th>State</th>
        <th>Expires</th><th>Status</th><th>Verification</th><th></th>
      </tr></thead>
      <tbody id="rows"></tbody>
    </table>
  </div>

  <div class="card">
    <h2>Add staff</h2>
    <form id="staff-form">
      <input name="name" placeholder="Name" required>
      <input name="role" placeholder="Role (RN, MD...)" required>
      <input name="npi" placeholder="NPI (optional)">
      <input name="email" type="email" placeholder="Email">
      <input name="manager_email" type="email" placeholder="Manager email">
      <button>Add staff</button>
    </form>
  </div>

  <div class="card">
    <h2>Add credential</h2>
    <form id="cred-form">
      <select name="staff_id" id="staff-select" required></select>
      <input name="type" placeholder="Type (RN License, BLS...)" required>
      <input name="number" placeholder="Number">
      <input name="state" placeholder="State" maxlength="2" size="5">
      <input name="expires_on" type="date" required>
      <button>Add credential</button>
    </form>
  </div>

<script>
const STATUSES = ["expired", "critical", "warning", "ok"];
const msg = document.getElementById("msg");

async function api(path, options) {
  const res = await fetch(path, options);
  const body = await res.json();
  if (!res.ok) throw new Error(body.detail ? JSON.stringify(body.detail) : res.statusText);
  return body;
}

function post(path, data) {
  return api(path, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(data) });
}

function cell(text) {
  const td = document.createElement("td");
  td.textContent = text == null ? "" : text;
  return td;
}

async function refresh() {
  const [creds, staff] = await Promise.all([api("/api/credentials"), api("/api/staff")]);

  const counts = document.getElementById("counts");
  counts.replaceChildren(...STATUSES.map(s => {
    const div = document.createElement("div");
    div.className = "count";
    const b = document.createElement("b");
    b.textContent = creds.filter(c => c.status === s).length;
    div.append(b, s);
    return div;
  }));

  document.getElementById("rows").replaceChildren(...creds.map(c => {
    const tr = document.createElement("tr");
    const status = document.createElement("td");
    const pill = document.createElement("span");
    pill.className = "pill " + c.status;
    pill.textContent = c.status + (c.days_left < 0 ? "" : " · " + c.days_left + "d");
    status.append(pill);

    const action = document.createElement("td");
    const btn = document.createElement("button");
    btn.className = "small";
    btn.textContent = "Verify";
    btn.onclick = () => run(() => post("/api/staff/" + c.staff_id + "/verify"));
    action.append(btn);

    tr.append(cell(c.staff_name), cell(c.staff_role), cell(c.type), cell(c.number), cell(c.state),
              cell(c.expires_on), status, cell(c.verification_status), action);
    return tr;
  }));

  document.getElementById("staff-select").replaceChildren(...staff.map(s => {
    const opt = document.createElement("option");
    opt.value = s.id;
    opt.textContent = s.name;
    return opt;
  }));
}

async function run(action) {
  msg.textContent = "";
  try { await action(); } catch (err) { msg.textContent = err.message; }
  await refresh();
}

function formData(form) {
  const data = {};
  for (const [k, v] of new FormData(form)) if (v !== "") data[k] = v;
  return data;
}

document.getElementById("staff-form").onsubmit = e => {
  e.preventDefault();
  run(async () => { await post("/api/staff", formData(e.target)); e.target.reset(); });
};

document.getElementById("cred-form").onsubmit = e => {
  e.preventDefault();
  const { staff_id, ...cred } = formData(e.target);
  run(async () => { await post("/api/staff/" + staff_id + "/credentials", cred); e.target.reset(); });
};

refresh();
</script>
</body>
</html>
